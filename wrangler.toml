# Cloudflare Worker for Three-Tier Continuous Assessment (brief §3.2, §11.3).
# .github/workflows/worker.yml finds or creates the D1 database "three-tier-ca" and writes its id
# below before each deploy; the placeholder is never used. Secrets are never written here: the
# workflow generates SESSION_KEY and NIN_PEPPER once and copies ADMIN_EMAILS, PAYSTACK_SECRET_KEY
# and ANTHROPIC_API_KEY from the repository's GitHub secrets.

name = "three-tier-ca"
main = "worker/src/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "three-tier-ca"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

[vars]
SITE_ORIGIN = "https://three-tier-continuous-assessment.github.io"
GOOGLE_CLIENT_ID = "BLOCKED-user-create-an-OAuth-client"
