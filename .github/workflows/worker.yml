# Deploys the Cloudflare Worker and applies the D1 migrations (brief §3.2, §11.3).
# BLOCKED(user): this does nothing until the repository has the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, and wrangler.toml has the real D1 database id.
name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'shared/**', 'config/**', 'wrangler.toml', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "No Cloudflare credentials yet: skipping the deploy."; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      - if: steps.creds.outputs.ok == 'true'
        run: node --test tests/*.test.mjs
      - if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply three-tier-ca --remote
      - if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
